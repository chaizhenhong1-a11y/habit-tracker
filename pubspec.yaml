name: habittracker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  crypto: ^3.0.7
  path_provider: ^2.1.5
  flutter:
    sdk: flutter
  flutter_localizations:   # 新增
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.1
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.0
  timezone: ^0.9.2
  image_picker: ^1.0.4
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.6
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon.png
    - assets/images/如花.png
    - assets/images/坤哥.png
    - assets/images/小女孩.png
    - assets/images/油腻大叔.png
    - assets/images/秃头.png
    - assets/l10n/zh.json
    - assets/l10n/en.json
